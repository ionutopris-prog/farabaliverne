<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Pagina nu s-a găsit · Fără Baliverne</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ink:#22271f; --ink-soft:#556050; --ink-faint:#87907c;
    --paper:#e7f0e4; --paper-2:#f1f7ef; --card:#ffffff;
    --line:#d6e2d0; --line-2:#bfd2b7; --accent:#a5372a; --green:#2f8a49;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);padding:24px}
  .box{max-width:560px;text-align:center;background:var(--card);border:1px solid var(--line-2);
    border-radius:20px;padding:48px 40px;box-shadow:0 18px 50px -24px rgba(31,49,31,.35)}
  .drop{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:64px;margin:0;color:var(--green);line-height:1}
  h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:10px 0 6px;font-weight:600}
  p{color:var(--ink-soft);font-size:16px;line-height:1.55;margin:0 0 26px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:12px}
  a.primary{background:var(--green);color:#fff}
  a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  a.btn:hover{transform:translateY(-1px)}
  .dev{margin-top:26px;font-style:italic;color:var(--ink-faint);font-size:13.5px;font-family:Georgia,serif}
</style>
</head>
<body>
  <div class="box">
    <svg class="drop" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#2f8a49"/>
      <path d="M32 12 C32 12 46 30 46 39 a14 14 0 0 1 -28 0 C18 30 32 12 32 12 Z" fill="#fff"/>
    </svg>
    <h1>404</h1>
    <h2>Pagina asta nu s-a găsit</h2>
    <p>Poate a fost mutată, poate linkul e greșit. Apa a trecut, pagina nu.<br>Hai înapoi la știrile verificate.</p>
    <div class="btns">
      <a class="btn primary" href="/">← Prima pagină</a>
      <a class="btn ghost" href="/metodologie.html">Cum verificăm</a>
    </div>
    <div class="dev">Apă, paie… Adevăr</div>
  </div>
<script>
(function(){
  function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f4234;color:#fff;padding:11px 18px;border-radius:12px;font:600 14px system-ui;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.25)';document.body.appendChild(t);setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';},1700);setTimeout(function(){t.remove();},2200);}
  window.gabeIt=function(){var url=location.href,title=(document.title||'Fără Baliverne').replace(/\s*[—-]\s*Fără Baliverne.*$/,'');
    if(navigator.share){navigator.share({title:title,text:title,url:url}).catch(function(){});return;}
    var enc=encodeURIComponent,u=enc(url),t=enc(title);
    var links=[['Postează pe Gabe','https://findgabe.app'],['Facebook','https://www.facebook.com/sharer/sharer.php?u='+u],['X','https://twitter.com/intent/tweet?url='+u+'&text='+t],['WhatsApp','https://wa.me/?text='+t+'%20'+u]];
    var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(30,40,30,.55);display:flex;align-items:center;justify-content:center;z-index:9998';
    var box='<div style="background:#fff;color:#20281f;border-radius:16px;padding:22px;max-width:340px;width:88%;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:system-ui"><div style="font-weight:800;font-size:16px;margin-bottom:4px">⚡ Dă mai departe</div><div style="font-size:13px;opacity:.7;margin-bottom:14px">Un share ajunge la zeci de oameni. Mulțumim!</div><button id="gcopy" style="width:100%;padding:11px;border:1px solid #cfe0cf;background:#eef5ea;border-radius:10px;font-weight:700;cursor:pointer;margin-bottom:8px">📋 Copiază link</button>';
    links.forEach(function(l){box+='<a href="'+l[1]+'" target="_blank" rel="noopener" style="display:block;padding:11px;border:1px solid #e2e8df;border-radius:10px;text-decoration:none;color:inherit;font-weight:600;margin-bottom:8px">'+l[0]+'</a>';});
    box+='<button id="gclose" style="width:100%;padding:9px;background:none;border:none;color:#888;cursor:pointer;font-size:13px">Închide</button></div>';
    ov.innerHTML=box;document.body.appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
    document.getElementById('gclose').onclick=function(){ov.remove();};
    document.getElementById('gcopy').onclick=function(){navigator.clipboard.writeText(url).then(function(){toast('Link copiat — dă-l mai departe!');ov.remove();});};};
  window.toggleLike=function(b){var k='fb_like_'+location.pathname,on=localStorage.getItem(k)!=='1';localStorage.setItem(k,on?'1':'0');b.style.background=on?'#a5372a':'';b.style.color=on?'#fff':'';if(on)toast('Mulțumim! ♥');};
  window.subscribeNotify=function(){if(!('Notification'in window)){toast('Salvează-ne cu Ctrl+D 🔖');return;}Notification.requestPermission().then(function(p){toast(p==='granted'?'Gata! Te anunțăm la verificări noi.':'Salvează-ne cu Ctrl+D 🔖');});};
  if(/\/a\//.test(location.pathname)){var fb=document.createElement('button');fb.textContent='⚡ Gabe it';fb.setAttribute('aria-label','Dă mai departe');fb.onclick=window.gabeIt;fb.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9997;padding:12px 18px;border:none;border-radius:30px;background:linear-gradient(135deg,#2f8a49,#1f6a37);color:#fff;font:800 15px system-ui;cursor:pointer;box-shadow:0 8px 24px rgba(47,138,73,.4)';document.body.appendChild(fb);}
})();
</script>
</body>
</html>
