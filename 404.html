<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Pagina nu s-a găsit · Fără Baliverne</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ink:#22271f; --ink-soft:#556050; --ink-faint:#87907c;
    --paper:#e7f0e4; --paper-2:#f1f7ef; --card:#ffffff;
    --line:#d6e2d0; --line-2:#bfd2b7; --accent:#a5372a; --green:#2f8a49;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);padding:24px}
  .box{max-width:560px;text-align:center;background:var(--card);border:1px solid var(--line-2);
    border-radius:20px;padding:48px 40px;box-shadow:0 18px 50px -24px rgba(31,49,31,.35)}
  .drop{width:64px;height:64px;margin:0 auto 20px;display:block}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:64px;margin:0;color:var(--green);line-height:1}
  h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:10px 0 6px;font-weight:600}
  p{color:var(--ink-soft);font-size:16px;line-height:1.55;margin:0 0 26px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:12px}
  a.primary{background:var(--green);color:#fff}
  a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  a.btn:hover{transform:translateY(-1px)}
  .dev{margin-top:26px;font-style:italic;color:var(--ink-faint);font-size:13.5px;font-family:Georgia,serif}

  /* ═══════════════════════════════════════════════════════════════════════
     PALETA „ALB APPLE + PETROL" — 4 septembrie 2026
     ═══════════════════════════════════════════════════════════════════════
     Aleasa de fondator dupa ce ne-am uitat la cum amesteca Apple culorile pe
     apple.com/macbook-air. Descoperirea care a schimbat tot: Apple NU coloreaza
     fundalul. Il tine gri-neutru (#f5f5f7) si lasa fotografia produsului sa
     aduca toata culoarea. Noi avem 513 poze pe prima pagina — deci fundalul se
     retrage, iar pozele ies in fata.

     🔴 Blocul asta sta la COADA foii de stil dinadins, ca sa bata regulile de
     mai sus fara !important. Daca vrei paleta veche inapoi: sterge blocul.
     Nu umbla la regulile de deasupra, sunt neatinse.

     🔴 Culorile verdictelor (--ok, --bad, --warn, --check) NU se ating.
     Alea nu sunt decor, sunt informatie: verde=probat, rosu=contrazis.
     De-aia accentul e petrol si nu rosu — caramiziul vechi (#a5372a) era
     aproape identic cu rosul de „Contestat" si ochiul le confunda pe alb.
     ═══════════════════════════════════════════════════════════════════════ */
  :root{
    --paper:#fbfbfd; --paper-2:#f7f7f9; --card:#ffffff;
    --line:#ececf1;  --line-2:#e0e0e6;
    --ink:#1d1d1f;   --ink-soft:#6e6e73; --ink-faint:#86868b;
    --accent:#13817d; --accent-deep:#0e6360; --accent-soft:#eef7f6;
    --panou-bg:#fafdfc; --panou-line:#eaf4f2;
    /* curba si durata luate din codul Apple: `color .32s cubic-bezier(.4,0,.6,1)` */
    --lin:.32s cubic-bezier(.4,0,.6,1);
  }

  /* accentul iese din litere; ramane doar pe fundaluri si butoane */
  .cat-tag, .section-head .more, .brand .amp,
  .panel .ph .tag, .math-block h2{color:var(--ink)}

  /* banda de sus: petrol DESCHIS, scris alb (era roz, din paleta veche).
     Fondatorul a observat ca banda si pastila „Acasa" aveau doua nuante
     diferite de petrol — #0e6360 sus, #13817d in meniu. Acum e una singura. */
  .topbar{background:var(--accent); color:rgba(255,255,255,.86)}

  /* 🔴 Meniul: TOATE intrarile arata la fel, inclusiv „Acasa".
     Pastila plina de dinainte il facea pe „Acasa" alt animal decat fratii lui.
     Cererea fondatorului, 4 sept 2026: „toate meniurile sa arate la fel" si
     „oglinda ca restul meniurilor".

     `:not(:hover)` e cheia si m-a prins o data. Cu `background:transparent`
     simplu pe `.nav a.active`, pastila dispare — dar dispare si oglinda, fiindca
     regula bate hover-ul la specificitate egala. Asa, cat sta linistit e ca
     oricare altul; sub mouse primeste aceeasi sticla.

     „Moldova" si „Cauta o afirmatie" raman cu conturul lor: nu sunt categorii,
     sunt destinatii. Decizia lui, aceeasi zi. */
  .nav a.active:not(:hover){background:transparent; box-shadow:none}
  .nav a.active{color:var(--ink-soft); font-weight:700}

  /* panourile din dreapta erau petrol PLIN si dureau ochii pe alb */
  .support-panel, .conclusion-box{
    background:var(--panou-bg); color:var(--ink);
    border:1px solid var(--panou-line);
    box-shadow:0 1px 2px rgba(16,60,58,.04), 0 10px 26px rgba(16,60,58,.05)}
  .support-panel h4, .conclusion-box h4, .support-panel b{color:var(--ink)}
  .support-panel p{color:#4a5654}
  .support-panel small{color:#6e7b79; opacity:1}
  .support-panel .sbtn, .conclusion-box .backlink{
    background:var(--accent); color:#fff; border:none}

  /* ── STICLA: bara de meniu si cardurile ────────────────────────────────
     Sticla mata are nevoie de ceva in spate ca sa se vada. Pe meniu merge —
     continutul trece pe sub el cand derulezi. Pe carduri, pozele razbat. */
  .nav{background:rgba(255,255,255,.68);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06)}
  .card{background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border:1px solid rgba(0,0,0,.05);
    box-shadow:0 1px 2px rgba(0,0,0,.03), 0 12px 28px rgba(0,0,0,.05)}

  /* ── OGLINDA: aceeasi miscare peste tot ────────────────────────────────
     Secretul nu e culoarea, e `inset 0 1px 0 rgba(255,255,255,...)`: dunga
     de lumina pe muchia de sus face pastila sa para sticla groasa prinsa de
     lumina. Fara ea arata a plastic. */
  .nav a, .nav .md, .nav .search, .card, .mini-row, .section-head .more,
  .support-panel .sbtn, .support-panel button, .support-panel a,
  .conclusion-box .backlink, .panel{
    transition:color var(--lin), background-color var(--lin),
               box-shadow var(--lin), transform var(--lin),
               border-color var(--lin), padding-left var(--lin)}

  .nav a:hover, .nav .md:hover, .nav .search:hover,
  .section-head .more:hover, .mini-row:hover{
    background:rgba(255,255,255,.72); color:var(--ink);
    border-radius:999px; text-decoration:none;
    -webkit-backdrop-filter:saturate(200%) blur(14px);
    backdrop-filter:saturate(200%) blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
               inset 0 -1px 0 rgba(0,0,0,.03),
               0 1px 2px rgba(0,0,0,.05), 0 8px 20px rgba(0,0,0,.08)}
  .mini-row:hover{border-radius:12px; padding-left:12px}

  .card:hover{transform:translateY(-4px); background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(200%) blur(18px);
    backdrop-filter:saturate(200%) blur(18px);
    border-color:rgba(255,255,255,.9);
    box-shadow:inset 0 1px 0 rgba(255,255,255,1),
               0 2px 4px rgba(0,0,0,.04), 0 20px 44px rgba(0,0,0,.13)}
  .panel:hover, .support-panel:hover{
    box-shadow:inset 0 1px 0 rgba(255,255,255,1),
               0 2px 4px rgba(16,60,58,.04), 0 16px 34px rgba(16,60,58,.10)}

  /* butoanele care isi au fundalul lor INCHIS (Facebook, X, Gabe it):
     luciu interior si ridicare, NU sticla alba — alba peste negru = murdarie */
  .support-panel .sbtn:hover, .conclusion-box .backlink:hover,
  .support-panel button[style*="background:#1877f2"]:hover,
  .support-panel button[style*="background:#000"]:hover,
  .support-panel a[onclick*="gabeIt"]:hover,
  .support-panel button[onclick*="gabeIt"]:hover{
    transform:translateY(-2px); filter:saturate(1.08) brightness(1.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),
               0 2px 5px rgba(0,0,0,.12), 0 12px 26px rgba(0,0,0,.22)}
  .support-panel button[style*="var(--card)"]:hover{
    background:rgba(255,255,255,.85); transform:translateY(-2px);
    -webkit-backdrop-filter:saturate(200%) blur(14px);
    backdrop-filter:saturate(200%) blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,1),
               0 2px 4px rgba(0,0,0,.05), 0 10px 22px rgba(0,0,0,.10)}

  /* „Minți luminate" — culoarea secțiunii de cercetare universitară.
     Chihlimbar spre bronz: singura familie caldă rămasă liberă. Verdele, roșul
     și albastrul sunt ale verdictelor, petrolul e accentul, mov e Extern.
     Numele e al fondatorului, 5 septembrie 2026 — „gen Beautiful Mind". */
  .g-minti{background:linear-gradient(135deg,#c9a227,#7d5f10)}

  /* Blocul „Articolul original, tradus integral" — sectiunea „Minți luminate".
     🔴 Se vede DIFERIT de restul dinadins: nu e textul nostru, e al altcuiva,
     tradus. Dunga din stanga il leaga de accent, iar corpul e mai mare si mai
     aerisit fiindca e de citit pe indelete, nu de scanat ca o lista de dovezi.
     Se foloseste doar cand sursa permite explicit reproducerea. */
  .ev-block.traducere{border-left:5px solid var(--accent)}
  .ev-block.traducere p{font-size:16.5px;line-height:1.68;margin:0 0 15px;color:var(--ink)}
  .ev-block.traducere p:last-child{margin-bottom:0}
  .ev-block.traducere .ev-sub{font-size:12.5px;line-height:1.5;
    padding:11px 13px;border-radius:10px;background:var(--accent-soft);
    color:var(--ink-soft);margin-bottom:20px}
  .ev-block.traducere .ev-sub a{color:var(--accent);font-weight:700}

  /* 🔴 Butonul de cautare e `position:sticky` lipit de marginea dreapta, deci
     cand meniul depaseste latimea, el PLUTESTE peste ce ajunge sub el — a
     acoperit „Moldova" cand am adaugat a 14-a intrare, pe 5 septembrie 2026.
     Prima incercare a fost `min-width` pe separator: a inrautatit, fiindca a
     mai adaugat 172px la un rand care oricum nu incapea.
     Reparatia adevarata e sa NU depaseasca: eticheta din meniu e scurtata la
     „Minți", titlul sectiunii ramane „Minți luminate". Daca se mai adauga
     vreodata o categorie, asta e locul unde se rupe primul. */
  .nav .md{flex-shrink:0}
</style>

<body>
  <div class="box">
    <svg class="drop" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#2f8a49"/>

    </svg>
    <h1>404</h1>
    <h2>Pagina asta nu s-a găsit</h2>
    <p>Poate a fost mutată, poate linkul e greșit. Apa a trecut, pagina nu.<br>Hai înapoi la știrile verificate.</p>
    <div class="btns">
      <a class="btn primary" href="/">← Prima pagină</a>
      <a class="btn ghost" href="/metodologie.html">Cum verificăm</a>
    </div>
    <div class="dev">Apă, paie… Adevăr</div>
  </div>
<script>
(function(){
  var U=location.href, T=(document.title||'Fără Baliverne').replace(/\s*[—-]\s*Fără Baliverne.*$/,'');
  function e(s){return encodeURIComponent(s);}
  function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f4234;color:#fff;padding:11px 18px;border-radius:12px;font:600 14px system-ui;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.25)';document.body.appendChild(t);setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';},1700);setTimeout(function(){t.remove();},2200);}
  window.gabeIt=function(){window.open('https://findgabe.app/?compose='+e(T+'\n'+U),'_blank','noopener');};
  window.__fbMobil=/Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent||'');window.shareFB=function(){if(window.__fbMobil&&navigator.share){navigator.share({title:T,url:U}).catch(function(){});return;}window.open('https://www.facebook.com/sharer/sharer.php?u='+e(U),'_blank','noopener,width=650,height=600');};
  window.shareX=function(){window.open('https://x.com/intent/post?url='+e(U)+'&text='+e(T),'_blank','noopener,width=560,height=460');};
  window.copyLink=function(){navigator.clipboard.writeText(U).then(function(){toast('Link copiat — dă-l mai departe!');});};
  window.toggleLike=function(b){var k='fb_like_'+location.pathname,on=localStorage.getItem(k)!=='1';localStorage.setItem(k,on?'1':'0');b.style.background=on?'#a5372a':'';b.style.color=on?'#fff':'';if(on)toast('Mulțumim! ♥');};
  window.subscribeNotify=function(){if(!('Notification'in window)){toast('Salvează-ne cu Ctrl+D 🔖');return;}Notification.requestPermission().then(function(p){toast(p==='granted'?'Gata! Te anunțăm la verificări noi.':'Salvează-ne cu Ctrl+D 🔖');});};
  if(/\/a\//.test(location.pathname)){
    var w=document.createElement('div');w.style.cssText='position:fixed;right:16px;bottom:16px;z-index:9997;display:flex;flex-direction:column;gap:8px;align-items:flex-end';
    var row=document.createElement('div');row.style.cssText='display:flex;gap:8px';
    function rnd(txt,fn,bg,fs){var b=document.createElement('button');b.innerHTML=txt;b.onclick=fn;b.style.cssText='width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;color:#fff;background:'+bg+';box-shadow:0 6px 16px rgba(0,0,0,.28);font:700 '+fs+' system-ui';return b;}
    row.appendChild(rnd('f',window.shareFB,'#1877f2','18px'));
    row.appendChild(rnd('𝕏',window.shareX,'#000','16px'));
    var g=document.createElement('button');g.innerHTML='⚡ Gabe it';g.onclick=window.gabeIt;g.style.cssText='padding:12px 18px;border:none;border-radius:30px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2f8a49,#1f6a37);box-shadow:0 8px 22px rgba(47,138,73,.4);font:800 15px system-ui';
    w.appendChild(row);w.appendChild(g);document.body.appendChild(w);
  }
})();
</script>

<script>
(function(){
  var el=document.querySelector('.topbar .date'); if(!el) return;
  var Z=['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
  var L=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
  function scrie(){
    var n=new Date(), h=n.getHours(), e;
    if(h>=5&&h<8) e='Ediția de dimineață';
    else if(h>=8&&h<11) e='Ediția de cafeluță';
    else if(h>=11&&h<14) e='Ediția de amiază';
    else if(h>=14&&h<17) e='Ediția de după-amiază';
    else if(h>=17&&h<20) e='Ediția de seară';
    else if(h>=20&&h<23) e='Ediția de seară târzie';
    else e='Ediția de noapte';
    el.textContent=Z[n.getDay()]+', '+n.getDate()+' '+L[n.getMonth()]+' '+n.getFullYear()+' · '+e;
  }
  scrie(); setInterval(scrie, 60000);
})();
</script>

<script>
(function(){
  var K='fb_citite';
  function citite(){ try{ return JSON.parse(localStorage.getItem(K)||'[]'); }catch(e){ return []; } }
  // Pe pagina articolului: reținem că a fost deschis.
  var m = location.pathname.match(/\/a\/([^\/]+)\.html$/);
  if(m){
    var L=citite(); if(L.indexOf(m[1])<0){ L.push(m[1]); try{ localStorage.setItem(K, JSON.stringify(L.slice(-400))); }catch(e){} }
    return;
  }
  // Pe prima pagină: ascundem ce s-a citit deja.
  if(!/(^\/$|index\.html$)/.test(location.pathname)) return;
  document.addEventListener('DOMContentLoaded', function(){
    var L=citite(); if(!L.length) return;
    var ascunse=0;
    document.querySelectorAll('main section.cat-section').forEach(function(sec){
      var tot=sec.querySelectorAll('a.card, a.mini-row');
      var deAscuns=[];
      tot.forEach(function(a){
        var h=a.getAttribute('href')||'';
        var s=(h.match(/a\/([^\/]+)\.html$/)||[])[1];
        if(s && L.indexOf(s)>=0) deAscuns.push(a);
      });
      // Dacă a citit tot din secțiune, o lăsăm întreagă — mai bine ceva decât gol.
      if(deAscuns.length && deAscuns.length < tot.length){
        deAscuns.forEach(function(a){ a.style.display='none'; a.dataset.fbCitit='1'; });
        ascunse += deAscuns.length;
      }
    });
    if(!ascunse) return;
    var b=document.createElement('button');
    b.textContent = ascunse===1 ? 'Arată și articolul pe care l-ai citit'
                                : 'Arată și cele '+ascunse+' pe care le-ai citit';
    b.style.cssText='display:block;margin:18px auto 0;padding:9px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-soft);font:600 13px system-ui;cursor:pointer';
    b.onclick=function(){
      document.querySelectorAll('[data-fb-citit]').forEach(function(a){ a.style.display=''; });
      b.remove();
    };
    var w=document.querySelector('main .wrap'); if(w) w.appendChild(b);
  });
})();
</script>
