<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ea"/>
      <stop offset="1" stop-color="#e0ecdb"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a49"/>
      <stop offset="1" stop-color="#1f6a37"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#a5372a"/>

  <!-- marca picatura -->
  <g transform="translate(96,150)">
    <rect width="120" height="120" rx="28" fill="url(#drop)"/>
    <path d="M60 22 C60 22 86 56 86 73 a26 26 0 0 1 -52 0 C34 56 60 22 60 22 Z" fill="#ffffff"/>
  </g>

  <!-- titlu -->
  <text x="250" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#22271f">Fără Baliverne</text>
  <text x="252" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#556050">Apă, paie… Adevăr</text>

  <!-- linie -->
  <rect x="96" y="360" width="1008" height="2" fill="#bfd2b7"/>

  <!-- subtitlu / principiu -->
  <text x="96" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#22271f">Nu decretăm „adevărat / fals".</text>
  <text x="96" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#22271f">Arătăm ce se <tspan fill="#2f8a49" font-weight="700">probează</tspan> — concluzia o tragi tu.</text>

  <!-- footer -->
  <text x="96" y="575" font-family="Arial, sans-serif" font-size="26" letter-spacing="2" fill="#87907c">FARABALIVERNE.RO · VERIFICARE CU SURSE</text>
</svg>
