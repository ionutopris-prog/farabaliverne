name: Fără Baliverne — ediția automată

# Rulează redactorul automat pe abonamentul MAX (token de abonament, NU cheie API).
# Secrete necesare în repo (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  = din `claude setup-token` (abonament Max, fără cost extra)
#   FTP_SERVER / FTP_USERNAME / FTP_PASSWORD  = deja setate

on:
  schedule:
    # ZI, la 90 DE MINUTE, în TOATE zilele (UTC 04–20:30 = EEST 07–23:30):
    # RO+Europa+SUA. Cron nu știe „la fiecare 90 de minute", așa că folosim două
    # linii: fixul la ore pare din serie și jumătatea la cele dintre ele. Ies
    # 04:00, 05:30, 07:00, 08:30, 10:00, 11:30, 13:00, 14:30, 16:00, 17:30,
    # 19:00, 20:30 — exact 90 de minute între ele.
    #
    # De ce mai rar: edițiile și sesiunile de lucru consumă din ACELAȘI abonament
    # Max. Pe 17 august, trei ediții la rând au picat pentru că se atinsese
    # plafonul, iar ziua s-a încheiat cu 8 articole în loc de ~40. Mai rar
    # înseamnă mai puține articole, dar publicate, nu pierdute la jumătate.
    # LA 120 DE MINUTE (decizia fondatorului, 21 august 2026): 9 ediții pe zi
    # în loc de 12. Motivul e bugetul — edițiile și sesiunile de lucru trag din
    # același abonament Max, iar pe 20-21 august zece ediții la rând au picat cu
    # „session limit" fiindcă lucram în paralel la alt proiect. Mai rar, dar care
    # chiar rulează, bate mai des și pe gol.
    # 5 ediţii de zi (decizia fondatorului, 24 august 2026), la orele când se
    # citeşte de fapt în România: 08, 12, 17, 20 şi 23. Erau 9, din două în două
    # ore, inclusiv la 07 dimineaţa şi la 19 lipit de 21 — ore în care nu intra
    # nimeni. Mai puţine, dar în ferestrele bune.
    #   05 UTC = 08 RO · dimineaţa, la deschiderea telefoanelor
    #   09 UTC = 12 RO · mijlocul zilei
    #   14 UTC = 17 RO · ieşirea de la muncă, cea mai bună fereastră
    #   17 UTC = 20 RO · seara, când se citeşte cel mai mult
    #   20 UTC = 23 RO · târziu, prinde şi după-amiaza americană
    - cron: "17 5,9,14,17,20 * * *"
    # MOLDOVA — două ediții proprii pe zi, cerute de fondator pe 26 august.
    #   07 UTC = 10 RO · dimineaţa
    #   12 UTC = 15 RO · după-amiaza
    # Merg pe presa de la Chişinău ŞI pe cea de limbă rusă, inclusiv Tiraspol.
    - cron: "23 7,12 * * *"
    - cron: "37 22 * * *"        # NOAPTE Asia/Orient/Media de stat (UTC 22 = EEST 01) — zilnic
    - cron: "43 1 * * *"         # NOAPTE ȘTIINȚĂ — ediție dedicată DOAR Științei (UTC 01 = EEST 04) — zilnic
  workflow_dispatch:            # buton „Run workflow" pentru test manual
    # De ce are optiune: fereastra se alegea DOAR dupa ora, deci o pornire
    # manuala la 10 UTC dadea mereu editia de zi. Nu se putea proba niciodata
    # editia moldoveneasca sau cea de noapte fara sa astepti ora ei — iar
    # GitHub sare des peste rularile programate (27 aug: 05, 07 si 09 UTC,
    # toate trei nerulate).
    inputs:
      fereastra:
        description: "Ce editie sa ruleze"
        required: false
        default: auto
        type: choice
        options: [auto, moldova, zi, weekend-international, asia, stiinta]

concurrency:
  group: editie-automata
  cancel-in-progress: false

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # ca botul să facă push
      pull-requests: write    # ca să deschidă PR la persoane numite
      actions: write          # ca să declanșeze workflow-ul de deploy
      issues: write           # ca să țină la zi problema cu articolele parcate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reține punctul de pornire
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compresia pozelor. Pe Mac merge `sips`, nativ; pe runner nu există
      # nimic, iar fără Pillow pozele rămân la 600 KB-1 MB și pică verificarea.
      # Exact asta a blocat publicarea 18 ore pe 12 august.
      - name: Unelte pentru poze
        run: |
          pip install --quiet Pillow
          # Fonturi pentru cardurile de partajare. Runnerul n-are Georgia (e
          # font Apple), iar fara un serif decent cardurile ies cu fontul
          # implicit al bibliotecii — citibil, dar urat. Liberation Serif e
          # aproape de Times, al doilea din stiva site-ului.
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalează Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Rulează redactorul (abonament Max)
        id: redactor
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secțiunea „Cloșcu cu Puii de AUR" — fișe de persoană + afirmațiile
          # lor verificate. E pornită explicit, nu implicit: vizează oameni
          # numiți, deci publicarea rămâne o decizie luată în clar.
          CLOSCU_ENABLED: "1"
        run: |
          git config user.name "Fara Baliverne Bot"
          git config user.email "bot@farabaliverne.ro"
          BEFORE="$(git rev-parse HEAD)"
          H=$((10#$(date -u +%H)))
          D=$(date -u +%u)          # 1=luni ... 6=sambata, 7=duminica
          # WEEKEND: in Romania nu prea se intampla nimic sambata si duminica,
          # iar internationalul se aduna necitit toata saptamana. Decizia
          # fondatorului (23 august 2026): pastram DOAR trei editii romanesti
          # pe zi in weekend (06, 12 si 18 UTC = 09, 15 si 21 EEST), iar
          # restul merg pe international, cu voie sa reia subiecte mari
          # scapate in cursul saptamanii.
          WEEKEND=0
          if [ "$D" -ge 6 ]; then WEEKEND=1; fi
          RO_WEEKEND=0
          if [ "$H" -eq 5 ] || [ "$H" -eq 14 ] || [ "$H" -eq 20 ]; then RO_WEEKEND=1; fi


          # 🔴 Fereastra se ia din CRON-UL care a declansat rularea, nu din ceas.
          # De ce: rularile programate pornesc cu intarzieri de 40-120 de minute.
          # O editie moldoveneasca de la 07:23 pornita la 08:10 ar fi citit ora 8
          # si ar fi facut editia de zi. Cron-ul spune ce trebuia sa fie.
          S="${{ github.event.schedule }}"
          case "$S" in
            "23 7,12 * * *") H=7  ;;   # MOLDOVA
            "37 22 * * *")   H=22 ;;   # ASIA
            "43 1 * * *")    H=1  ;;   # STIINTA
          esac

          # Fereastra fortata de la buton bate si cron-ul, si ceasul.
          F="${{ github.event.inputs.fereastra }}"
          if [ -n "$F" ] && [ "$F" != "auto" ]; then
            case "$F" in
              moldova)              H=7  ;;
              zi)                   H=9; WEEKEND=0 ;;
              weekend-international) H=9; WEEKEND=1; RO_WEEKEND=0 ;;
              asia)                 H=22 ;;
              stiinta)              H=1  ;;
            esac
            echo "fereastra fortata manual: $F"
          fi

          if [ "$H" -eq 7 ] || [ "$H" -eq 12 ]; then
            W="MOLDOVA (10 si 15 RO) — editie DEDICATA Republicii Moldova. Publica 2-3 articole, toate despre Republica Moldova, si pune in JSON campul \"tara\": \"Moldova\" la fiecare.
            SURSE de pornit, in limba romana: Moldpres (agentie de stat, eticheteaz-o), Moldova 1 (televiziune publica), TVR Moldova, NewsMaker, Ziarul de Garda, Realitatea.md, Unimedia, Jurnal.md, TV8, IPN, Agora, #diez, Europa Libera Moldova, Bani.md.
            SURSE in limba RUSA, obligatoriu consultate: NewsMaker ru, Point.md, Logos Press, Infotag, Nokta. Presa de stat rusa (Sputnik Moldova, TASS, RIA, Lenta, Rossiyskaya Gazeta) se poate cita DOAR etichetata ca presa de stat si DOAR alaturi de o sursa independenta.
            TIRASPOL: agentia oficiala Novosti Pridnestrovya si Vspmr.org se pot cita, etichetate explicit ca surse ale administratiei de la Tiraspol, cu verificare incrucisata din presa independenta de la Chisinau. NU le ignora — sunt singurele care spun ce a decis administratia de acolo.
            INSTITUTII: ANRE, BNM, Biroul National de Statistica, Guvernul si Parlamentul Republicii Moldova, instante.justice.md.
            TOT ce publici e in limba ROMANA. Traducerile din rusa se marcheaza ca atare, cu link la textul original.
            La ECONOMIE scrie despre economia MOLDOVEI (gaz, ANRE, leul moldovenesc, remitente, buget, exporturi), nu despre cea romaneasca.
            Verifica intai in data/ ca nu ai facut deja subiectul (scripts/seamana.py). Daca nu gasesti trei subiecte NOI cu miza, publica doua — nu umple cu comunicate."
          elif [ "$H" -ge 5 ] && [ "$H" -le 20 ] && [ "$WEEKEND" -eq 1 ] && [ "$RO_WEEKEND" -eq 0 ]; then
            W="ZI DE WEEKEND — INTERNATIONAL. REGULA ROMANIEI NU SE APLICA in fereastra asta: nu esti obligat sa publici despre Romania, si NU forta un subiect romanesc slab doar ca sa bifezi. Acoperi TOATA LUMEA, fara regiune obligatorie: Asia-Pacific, America (SUA, Canada, America Latina), Africa, Europa, Orientul Mijlociu. ROTESTE regiunile intre editii si in cadrul aceleiasi editii — nu face trei articole despre aceeasi tara. Alege dupa MIZA subiectului, nu dupa harta. Ai voie si TREBUIE sa reiei subiecte MARI din cursul saptamanii care au ramas neacoperite — nu doar ce s-a intamplat in ultimele ore: o lege importanta votata marti, o decizie de instanta de joi, un raport economic de vineri. Verifica intai in data/ ca nu le-ai facut deja (foloseste scripts/seamana.py). Prefera subiecte CU MIZA, unde exista afirmatii de verificat, nu comunicate. Daca gasesti totusi ceva romanesc nou si important, publica-l — dar ca alegere, nu ca obligatie."
          elif [ "$H" -ge 5 ] && [ "$H" -le 20 ]; then
            W="ZI (06-23 EEST) — Romania + Europa + SUA (politica/economie/social/sport/extern). NU Stiinta (are editie proprie noaptea). Daca presa romaneasca nu are subiecte NOI, completeaza din presa INTERNATIONALA, inclusiv din EST (Asia/Orient, unde ziua s-a incheiat) — rezumat in romana + link sursa + eticheta traducere AI. Nu lasa editia goala."
          elif [ "$H" -eq 1 ]; then
            W="NOAPTE STIINTA (04 EEST) — editie DEDICATA DOAR categoriei Stiinta: spatiu, sanatate, tehnologie, clima, descoperiri, cu surse primare (NASA/ESA, reviste, agentii). Publica 2-4 articole doar Stiinta."
          else
            W="NOAPTE ASIA/ORIENT (01 EEST) — Asia-Pacific + Orientul Mijlociu + Media de stat (etichetata + cross-check independent)."
          fi
          PROMPT="$(cat .github/edition-prompt.md)

          FEREASTRA CURENTA: $W"
          # Buget de tururi: 80, coborât de la 120 pe 17 august.
          #
          # Se putea cobora abia DUPĂ ce promptul a fost schimbat să publice după
          # FIECARE articol, nu la final. Cu commit doar la sfârșit, un buget
          # epuizat pierdea toată munca rulării — asta s-a întâmplat pe 11
          # august, când bugetul era 50. Acum un buget atins costă cel mult
          # articolul în lucru.
          #
          # De ce mai mic: edițiile și sesiunile de lucru consumă din același
          # abonament Max. Rulările de 29 de minute nu produceau mai multe
          # articole — se învârteau în cercetare care se relua.
          set +e
          claude -p "$PROMPT" \
            --model sonnet \
            --dangerously-skip-permissions \
            --max-turns 80
          CODE=$?
          set -e

          AFTER="$(git rev-parse HEAD)"
          PENDING="$(git branch --list 'pending/*' | wc -l | tr -d ' ')"

          # Punctul de pornire al ediției. Pașii de mai jos verifică pozele
          # apărute DE ATUNCI — redactorul face mai multe commituri, deci
          # „ultimul commit" ar rata majoritatea lor.
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" != "$AFTER" ] || [ "$PENDING" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Ediție publicată."
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"

          # Nimic publicat. Dacă redactorul a murit (plafon de tururi, limită de
          # sesiune, token expirat), rularea TREBUIE să pice — altfel eșecul e
          # invizibil și site-ul stă pe loc cu toate bifele verzi.
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Redactorul a ieșit cu cod $CODE și nu a publicat nimic. Cauze uzuale: plafon de tururi atins înainte de commit, limită de sesiune Max, sau CLAUDE_CODE_OAUTH_TOKEN expirat."
            exit 1
          fi

          echo "::warning::Redactorul a terminat normal, dar nu a găsit subiecte noi de publicat."

      # Publicarea o face workflow-ul dedicat „Deploy la Datahost (FTP)" (deploy.yml),
      # care e dovedit stabil. Îl declanșăm după ce botul a pus articolele pe main.
      # Decuplat: dacă FTP-ul are un timeout trecător, deploy.yml se re-rulează singur,
      # fără să pice ediția (conținutul e deja în siguranță pe GitHub).
      # Verificarea rulează exact când apare conținut nou, nu pe un ceas
      # arbitrar. Prinde hotlinkurile spre pozele altor publicații, legendele
      # incomplete și pozele prea grele — înainte ca ele să ajungă pe site.
      # Greutatea pozei e o problemă de performanță, nu de legalitate. O reparăm
      # aici, ca verificarea de mai jos să rămână plasă de siguranță pentru ce
      # chiar trebuie să oprească publicarea (hotlink, atribuire lipsă) — nu
      # blocaj de rutină pentru o poză de 400 KB.
      # Un `git push` simplu moare cu exit 128 daca altcineva a urcat pe main
      # intre timp: alta editie, workflow-ul de deploy, sau fondatorul lucrand
      # local. Pasul pica, iar pasii de dupa (carduri de partajare, lista de
      # postat) se sar — desi articolele erau deja in siguranta. S-a intamplat
      # pe 23 august, la prima rulare de dupa reparatii.
      # Functia trage cu rebase si reincearca de trei ori inainte sa renunte.
      - name: Pregăteste urcarea în siguranță
        run: |
          cat > "$RUNNER_TEMP/urca.sh" <<'SH'
          urca() {
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin main && return 0
              echo "push respins (incercarea $i) — mai incerc"
              sleep $((i * 5))
            done
            echo "::warning::Nu am putut urca dupa 3 incercari; continui, articolele sunt deja comise local."
            return 0
          }
          SH
          echo "OK"

      - name: Repară pozele prea grele
        if: steps.redactor.outputs.changed == 'true'
        run: |
          python3 scripts/shrink_images.py
          if ! git diff --quiet; then
            git config user.name "Fără Baliverne (bot)"
            git config user.email "bot@farabaliverne.ro"
            git add -A
            git commit -m "Poze: recomprimate sub limita de greutate"
            . "$RUNNER_TEMP/urca.sh"; urca
          fi

      # Se UITĂ la pozele noi. Tot ce a ajuns greșit pe site a trecut de
      # verificarea de metadate fără o vorbă: drapelul Turciei pe patru
      # articole despre Ucraina, Kievul sub o știre despre Dnipro, obuze cu
      # iperită sub o uzină convențională. Nimic din astea nu se vede altfel
      # decât uitându-te la fotografie.
      #
      # Nu blochează publicarea: poza nepotrivită e scoasă și rămâne cardul de
      # brand. O poză greșită doare, un site care nu mai publică doare mai
      # mult — asta a costat 18 ore pe 12 august.
      - name: Se uită la pozele noi
        if: steps.redactor.outputs.changed == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DE_LA: ${{ steps.redactor.outputs.before }}
        run: |
          python3 scripts/verifica_poza.py --noi --repara
          if ! git diff --quiet; then
            git config user.name "Fără Baliverne (bot)"
            git config user.email "bot@farabaliverne.ro"
            git add -A
            git commit -m "Poze: scoase cele care nu se potriveau cu articolul"
            . "$RUNNER_TEMP/urca.sh"; urca
          fi

      # Repară singur ce se poate repara, ÎNAINTE de verificarea care oprește
      # publicarea. Pe 23 august, trei ediții la rând au fost marcate ROȘU deși
      # publicaseră 9 articole: verificarea pica pe trei poze hotlinkate din
      # articole VECHI, plus una de 311 KB și una cu numele schimbat la
      # redenumirea slug-ului. Fondatorul primea „all jobs have failed" pentru
      # muncă reușită, iar cardurile de partajare și lista de postat rămâneau
      # nefăcute, fiindcă pașii de după un pas picat se sar.
      # Scoaterea hotlinkului nu slăbește regula — o aplică automat: poza
      # străină dispare și rămâne cardul de brand, exact ce cerea verificarea.
      - name: Repară singur pozele hotlinkate
        if: steps.redactor.outputs.changed == 'true'
        continue-on-error: true
        run: |
          python3 scripts/scoate_hotlink.py --chiar
          if ! git diff --quiet; then
            git config user.name "Fără Baliverne (bot)"
            git config user.email "bot@farabaliverne.ro"
            git add -A
            git commit -m "Poze: scoase hotlinkurile, rămâne cardul de brand"
            . "$RUNNER_TEMP/urca.sh"; urca
          fi

      - name: Verifică pozele
        if: steps.redactor.outputs.changed == 'true'
        run: python3 scripts/verify_images.py

      # Cardul de partajare — imaginea care apare cand cineva da share. Se face
      # DUPA verificarea pozelor: cardul foloseste fotografia articolului ca
      # fundal, deci trebuie sa fie fotografia buna, nu una scoasa apoi.
      - name: Fă cardurile de partajare
        if: steps.redactor.outputs.changed == 'true'
        run: |
          python3 scripts/card_share.py
          python3 scripts/build_site.py
          if ! git diff --quiet || [ -n "$(git status --porcelain img/share)" ]; then
            git add -A
            git commit -m "Carduri de partajare pentru articolele noi"
            . "$RUNNER_TEMP/urca.sh"; urca
          fi

      # Lista de postat manual pe X. API-ul X cere $0,20 pentru o postare cu
      # link, deci postarea automată ar costa ~$126/lună — pentru un cont pe
      # care postările iau 1-19 vizualizări. Postăm manual; pagina asta face
      # să dureze zece secunde.
      - name: Reface lista de postat
        if: steps.redactor.outputs.changed == 'true'
        run: |
          python3 scripts/build_post_queue.py
          if ! git diff --quiet de-postat.html; then
            git add de-postat.html
            git commit -m "Lista de postat, actualizată"
            . "$RUNNER_TEMP/urca.sh"; urca
          fi

      # Poarta de siguranță oprea articolele sensibile pe ramuri `pending/`,
      # dar nu anunța pe nimeni: până pe 21 august se adunaseră acolo 67, dintre
      # care 49 de politică internă. Acum, la fiecare ediție, ce e parcat ajunge
      # într-o singură problemă pe GitHub, actualizată — nu într-o tăcere.
      - name: Ce a rămas parcat (o singură problemă, actualizată)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/parcate.py || true

      # Rulează MEREU, chiar dacă redactorul a picat la jumătate.
      # Pe 20-21 august, redactorul a comis 8 articole și apoi a atins plafonul de
      # abonament; fiind pas eșuat, GitHub a sărit peste publicare, iar articolele
      # au stat o zi întreagă în repo fără să ajungă pe site. Nu ne mai uităm dacă
      # redactorul a reușit, ci dacă pe main chiar a apărut ceva nou.
      - name: Publică (declanșează deploy-ul)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          INAINTE="${{ steps.base.outputs.sha }}"
          ACUM="$(git rev-parse origin/main)"
          if [ "$INAINTE" != "$ACUM" ]; then
            echo "main a avansat: $INAINTE -> $ACUM · urc pe site"
            gh workflow run deploy.yml --ref main
          else
            echo "nimic nou pe main · nu e nimic de urcat"
          fi
