name: Fără Baliverne — ediția automată

# Rulează redactorul automat pe abonamentul MAX (token de abonament, NU cheie API).
# Secrete necesare în repo (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  = din `claude setup-token` (abonament Max, fără cost extra)
#   FTP_SERVER / FTP_USERNAME / FTP_PASSWORD  = deja setate

on:
  schedule:
    - cron: "0 3-20 * * *"     # ZI, la FIECARE ORĂ (UTC 03–20 = EEST 06–23): RO+Europa+SUA
    - cron: "0 22 * * *"        # NOAPTE Asia/Orient/Media de stat (UTC 22 = EEST 01)
    - cron: "0 1 * * *"         # NOAPTE ȘTIINȚĂ — ediție dedicată DOAR Științei (UTC 01 = EEST 04)
  workflow_dispatch: {}         # buton „Run workflow" pentru test manual

concurrency:
  group: editie-automata
  cancel-in-progress: false

jobs:
  editie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # ca botul să facă push
      pull-requests: write    # ca să deschidă PR la persoane numite
      actions: write          # ca să declanșeze workflow-ul de deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalează Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Rulează redactorul (abonament Max)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fara Baliverne Bot"
          git config user.email "bot@farabaliverne.ro"
          H=$((10#$(date -u +%H)))
          if [ "$H" -ge 3 ] && [ "$H" -le 20 ]; then
            W="ZI (06-23 EEST) — Romania + Europa + SUA (politica/economie/social/sport/extern). NU Stiinta (are editie proprie noaptea)."
          elif [ "$H" -eq 1 ]; then
            W="NOAPTE STIINTA (04 EEST) — editie DEDICATA DOAR categoriei Stiinta: spatiu, sanatate, tehnologie, clima, descoperiri, cu surse primare (NASA/ESA, reviste, agentii). Publica 2-4 articole doar Stiinta."
          else
            W="NOAPTE ASIA/ORIENT (01 EEST) — Asia-Pacific + Orientul Mijlociu + Media de stat (etichetata + cross-check independent)."
          fi
          PROMPT="$(cat .github/edition-prompt.md)

          FEREASTRA CURENTA: $W"
          claude -p "$PROMPT" \
            --model sonnet \
            --dangerously-skip-permissions \
            --max-turns 80 || echo "::warning::Claude a ieșit cu cod non-zero (verifică log-ul)"

      # Publicarea o face workflow-ul dedicat „Deploy la Datahost (FTP)" (deploy.yml),
      # care e dovedit stabil. Îl declanșăm după ce botul a pus articolele pe main.
      # Decuplat: dacă FTP-ul are un timeout trecător, deploy.yml se re-rulează singur,
      # fără să pice ediția (conținutul e deja în siguranță pe GitHub).
      - name: Publică (declanșează deploy-ul)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
