name: Deploy la Datahost (FTP)

# Urcă site-ul pe farabaliverne.ro la fiecare push pe main.
# Parola FTP stă în secretele GitHub (Settings → Secrets and variables → Actions):
#   FTP_SERVER    = ftp.farabaliverne.ro
#   FTP_USERNAME  = deploy@farabaliverne.ro
#   FTP_PASSWORD  = (parola contului FTP)

on:
  push:
    branches: [main]
    # Ce nu ajunge niciodată pe FTP nu are de ce să declanșeze un deploy.
    # `data/` e sursă de build, nu se urcă — iar workflow-ul de Facebook scrie
    # acolo starea cozii la fiecare 30 de minute. Fără filtrul ăsta ieșeau ~48
    # de deploy-uri pe zi care nu urcau nimic.
    paths-ignore:
      - 'data/**'
      - '**/*.md'
      - '.github/**'
      - 'scripts/**'
  workflow_dispatch: {}   # buton de rulare manuală (îl folosește și ediția)

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy prin FTP
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ./
          timeout: 60000
          # NU urca (și NU șterge) astea:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            data/**
            preview/**
            dist/**
            **/*.md
            og-cover.svg
            .gitignore
            php.ini
            .user.ini
            .well-known/**
            scripts/**
            farabaliverne-deploy.zip

      # Reîncercare automată dacă FTP-ul a dat timeout trecător (control socket)
      - name: Deploy prin FTP (reîncercare)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ./
          timeout: 90000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            data/**
            preview/**
            dist/**
            **/*.md
            og-cover.svg
            .gitignore
            php.ini
            .user.ini
            .well-known/**
            scripts/**
            farabaliverne-deploy.zip
