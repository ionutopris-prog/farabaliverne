<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Se deschide X…</title>
<style>body{font:16px system-ui;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;color:#333}</style>
</head>
<body>
<p>Se deschide X…</p>
<script>
// Fereastra-tampon pentru butonul X. De ce există (12 septembrie 2026):
// X ignoră parametrii `url` și `text` când pagina lui e deschisă DIRECT în
// popup dintr-un alt site (fereastra de compunere apărea goală, cu parametrii
// încă în adresă). Aceeași adresă, încărcată ca navigare proprie a ferestrei,
// fără referrer, vine cu textul și linkul gata scrise (testat în Chrome).
// Deci popup-ul deschide întâi pagina asta, de pe domeniul nostru, iar ea
// trece la X prin location.replace — o navigare curată, fără referrer.
(function(){
  var q=new URLSearchParams(location.search);
  var u=q.get('u')||'https://farabaliverne.ro/', t=q.get('t')||'Fără Baliverne';
  location.replace('https://x.com/intent/post?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t));
})();
</script>
</body>
</html>
